# Default experiment configuration. Every key is optional; see src/lte_forecast/config.py for defaults.
out_dir = "results"

[data]
path = "data/Dataset_02_LTE_1800.csv"
idle_fill = true            # RB utilisation NaN with zero traffic and zero users -> 0 % (idle), not a gap
min_cell_coverage = 0.5     # drop cells observed in < 50 % of the timeline

[split]
n_folds = 3                 # rolling-origin folds, expanding training window
test_days = 7
calib_days = 7              # conformal calibration block directly before each test block
train_stride = 2            # every 2nd 15-min origin for training (adjacent slots are near-duplicates)

[model]
horizons_h = [1, 2, 3, 4, 5, 6]
rb_quantiles = [0.5, 0.8, 0.9, 0.95, 0.99]   # 0.5 = point forecast; the rest feed the conformal upper bounds
vol_quantiles = [0.5, 0.9]
n_rounds = 250
learning_rate = 0.08
max_depth = 6
min_child_weight = 20.0
subsample = 0.8
colsample_bytree = 0.8
max_bin = 128
n_jobs = 0                  # 0 = all cores
seed = 42
holidays = ["2025-01-01", "2025-01-06", "2025-04-18", "2025-04-21", "2025-05-01", "2025-05-08"]  # Slovak public holidays in the data window

[sleep]
theta = 10.0                # sleep when (forecast) RB utilisation < 10 %
severe_theta = 30.0         # a false sleep is "severe" when actual load >= 30 %
alphas = [0.2, 0.1, 0.05, 0.01]
sleep_power_fraction = 0.3  # ASSUMPTION: a sleeping radio unit still draws 30 % of its energy. Vary it; see docs/methodology.md
point_thresholds = [1, 2, 3, 4, 5, 6, 8, 10]
horizons_h = [1, 3, 6]

[bootstrap]
n_boot = 500
seed = 7
